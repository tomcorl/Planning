name: Backup Supabase DB

on:
  schedule:
    - cron: '0 10 * * *'
    - cron: '0 17 * * *'
  workflow_dispatch:

concurrency:
  group: backup-supabase
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client 17
        run: |
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17

      - name: Dump database
        run: |
          mkdir -p backups
          /usr/lib/postgresql/17/bin/pg_dump "${{ secrets.DATABASE_URL }}" > backups/backup-$(date +'%Y-%m-%d-%H%M').sql

      - name: Delete backups older than 14 days
        run: |
          find backups/ -name "*.sql" -mtime +14 -delete

      - name: Commit backup
        run: |
          git config user.name "backup-bot"
          git config user.email "backup-bot@users.noreply.github.com"
          git add backups/
          git commit -m "Backup $(date +'%Y-%m-%d %H:%M')" || echo "Rien à commit"
          git pull --rebase origin main
          git push
